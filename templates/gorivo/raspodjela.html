{% extends "base.html" %}

{% block content %}
<div class="container">
  <h2>Raspodjela goriva</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Spremi raspodjelu</button>
    <a href="{% url 'gorivo' %}" class="btn btn-secondary">Nazad</a>
  </form>
</div>
{% endblock %}
