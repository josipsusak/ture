<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ture vozača{% endblock %}</title>
    <!-- ✅ Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</head>
<body class="bg-light">

<!-- 🔹 Gornja navigacija -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{% url 'homepage' %}">🚛 Ture vozača</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        {% if request.user.is_authenticated %}
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'homepage' %}active{% endif %}" href="{% url 'homepage' %}">Početna</a></li>
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'popis_vozaca' %}active{% endif %}" href="{% url 'popis_vozaca' %}">Vozači</a></li>
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'popis_vozila' %}active{% endif %}" href="{% url 'popis_vozila' %}">Vozila</a></li>
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'cijene_dnevnica' %}active{% endif %}" href="{% url 'cijene_dnevnica' %}">Cijene dnevnica</a></li>
        <li class="nav-item"><a class="nav-link {% if request.resolver_match.url_name == 'gorivo' %}active{% endif %}" href="{% url 'gorivo' %}">Gorivo</a></li>
        <li class="nav-item"><a class="btn btn-sm btn-danger" href="{% url 'logout' %}">Odjava</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<!-- 🔹 Glavni sadržaj -->
<div class="container mb-5">
    {% block content %}
    {% endblock %}
</div>

<!-- 🔹 Footer -->
<footer class="bg-primary text-white text-center py-3">
    <small>© {% now "Y" %} Sustav za ture vozača</small>
</footer>

<!-- ✅ Bootstrap JS Bundle with Popper -->
<script>
  document.getElementById('tjedan_rn').addEventListener('change', function() {
      const selected = this.options[this.selectedIndex];
      const godina = selected.getAttribute('data-godina');
      document.getElementById('godina_tjedan_rn_input').value = godina || '';
  });
</script>

</body>
</html>
